[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "browsermem"
version = "0.1.0"
description = "Real-time browser tab URLs and titles for Python on Windows: get the active tab, react to tab changes, track browsing activity. Chrome, Edge, Brave, Opera, Vivaldi."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "BinaryBreaker" }]
maintainers = [{ name = "BinaryBreaker" }]
requires-python = ">=3.9"
dependencies = []
keywords = [
  "browser", "url", "active-tab", "current-url", "tab", "chrome", "edge", "brave",
  "real-time", "monitoring", "activity-tracking", "windows", "automation", "forensics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: System :: Monitoring",
  "Topic :: Utilities",
  "Topic :: Security",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-timeout>=2"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["browsermem[test,docs]", "ruff>=0.6", "build>=1"]

[project.urls]
Homepage = "https://github.com/BinaryBreaker/browsermem"
Documentation = "https://binarybreaker.github.io/browsermem/"
Issues = "https://github.com/BinaryBreaker/browsermem/issues"
Changelog = "https://github.com/BinaryBreaker/browsermem/blob/main/CHANGELOG.md"

[project.scripts]
browsermem = "browsermem.cli:main"

# ---- build -------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/browsermem"]
# The DLL is loaded with ctypes (no CPython C-API), so one wheel serves every
# Python 3 version: browsermem-X-py3-none-win_amd64.whl
wheel.py-api = "py3"
sdist.exclude = [".github", ".idea", ".venv", "build", "dist", "site", "*.dmp"]

# ---- tools -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 120
markers = [
  "browser: needs a real browser (set BROWSERMEM_TEST_BROWSER=1 to run)",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["build", "site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional/List for 3.9

[tool.ruff.lint.per-file-ignores]
"src/browsermem/_native.py" = ["N801"]
